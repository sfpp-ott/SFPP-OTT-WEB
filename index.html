
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFPP ELITE - Full Fix</title>
    <style>
        :root { --accent: #0078ff; --bg: #05080a; --card: #10141d; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #000; height: 60px; display: none; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #222; flex-shrink: 0; }
        .nav-links button { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; font-weight: bold; padding: 8px; border-radius: 4px; }
        .nav-links button.active { color: white; background: var(--accent); }
        .search-input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 6px 12px; border-radius: 20px; width: 140px; outline: none; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 220px; background: #0a0e14; border-right: 1px solid #222; overflow-y: auto; display: none; }
        .cat-item { padding: 12px; color: #aaa; cursor: pointer; font-size: 13px; border-bottom: 1px solid #111; border-left: 3px solid transparent; }
        .cat-item.active { background: #1c2531; color: var(--accent); border-left-color: var(--accent); }
        #content { flex: 1; padding: 15px; overflow-y: auto; background: #05080a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid #222; }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; }
        .card p { margin: 0; padding: 8px; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #login-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 5000; }
        .login-box { background: #111; padding: 30px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #333; background: #000; color: white; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; padding: 15px; }
        .modal-box { background: #0d1117; width: 500px; max-width: 100%; border-radius: 10px; border: 1px solid #333; overflow: hidden; }
        .modal-body { padding: 20px; }
        .epg-box { margin: 15px 0; padding: 12px; background: #1a1a1a; border-radius: 6px; border-left: 4px solid var(--accent); }
        .btn-play { background: var(--accent); color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--accent); margin-top:0;">SFPP ELITE</h2>
        <select id="srv"><option value="http://my-sfpp.net">Standard</option><option value="http://sfppprime.net">Premium</option></select>
        <input type="text" id="u" placeholder="Utilisateur">
        <input type="password" id="p" placeholder="Mot de passe">
        <button onclick="connect()" style="width:100%; padding:10px; background:var(--accent); border:none; color:white; border-radius:4px; cursor:pointer; font-weight:bold;">CONNEXION</button>
    </div>
</div>

<header id="header">
    <div class="nav-links">
        <button id="btn-live" onclick="switchTab('get_live_categories', 'get_live_streams', this)">TV</button>
        <button id="btn-vod" onclick="switchTab('get_vod_categories', 'get_vod_streams', this)">FILMS</button>
        <button id="btn-series" onclick="switchTab('get_series_categories', 'get_series', this)">SÉRIES</button>
    </div>
    <div style="display:flex; align-items:center;">
        <input type="text" id="search-bar" class="search-input" placeholder="Chercher..." oninput="doSearch()">
        <button onclick="logout()" style="color:red; background:none; border:none; cursor:pointer; margin-left:10px; font-weight:bold;">QUITTER</button>
    </div>
</header>

<div class="main-container">
    <div id="sidebar"></div>
    <div id="content"><div id="grid" class="grid"></div></div>
</div>

<div id="modal" class="modal">
    <div class="modal-box">
        <div class="modal-body">
            <button onclick="closeModal()" style="float:right; color:#888; background:none; border:none; font-size:28px; cursor:pointer;">&times;</button>
            <h3 id="m-title" style="margin:0; padding-right:20px; color:var(--accent);"></h3>
            
            <div id="epg-container" style="display:none;">
                <div class="epg-box">
                    <div style="font-size:11px; color:var(--accent); text-transform:uppercase; margin-bottom:5px;">En ce moment</div>
                    <div id="m-epg-title" style="font-weight:bold; font-size:14px; color:#fff;">Chargement...</div>
                </div>
            </div>

            <div id="plot-container" style="margin-top:15px;">
                <div style="font-size:11px; color:var(--accent); text-transform:uppercase; margin-bottom:5px;">Résumé</div>
                <p id="m-plot" style="font-size:13px; color:#bbb; line-height:1.5; max-height:200px; overflow-y:auto; margin:0;"></p>
            </div>
            
            <div id="series-ui" style="display:none; margin-top:15px;">
                <h4 style="margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:5px; font-size:14px;">ÉPISODES</h4>
                <div id="ep-list" style="max-height:180px; overflow-y:auto;"></div>
            </div>
            
            <button id="vlc-start" class="btn-play" style="margin-top:15px;">LIRE AVEC VLC</button>
        </div>
    </div>
</div>

<script>
    let srv, user, pass, currentList = [], currentMode = "";

    function fixText(str) {
        if (!str || typeof str !== 'string') return str;
        let d = str.trim();
        // Décodage Base64 si la chaîne finit par = ou n'a pas d'espace et est longue
        if ((d.endsWith('=') || (d.length > 20 && !d.includes(' '))) && /^[A-Za-z0-9+/=]+$/.test(d)) {
            try { d = atob(d); } catch (e) {}
        }
        try { return decodeURIComponent(escape(d)); } catch (e) { return d; }
    }

    window.onload = () => {
        const u = localStorage.getItem('sfpp_user'), p = localStorage.getItem('sfpp_pass'), s = localStorage.getItem('sfpp_srv');
        if(u && p) { 
            document.getElementById('u').value=u; document.getElementById('p').value=p; 
            document.getElementById('srv').value=s || "http://my-sfpp.net"; 
            connect(); 
        }
    };

    function logout() { localStorage.clear(); location.reload(); }

    async function connect() {
        srv = document.getElementById('srv').value;
        user = document.getElementById('u').value.trim();
        pass = document.getElementById('p').value.trim();
        try {
            const r = await fetch(`${srv}/player_api.php?username=${user}&password=${pass}`);
            const d = await r.json();
            if(d.user_info && d.user_info.auth) {
                localStorage.setItem('sfpp_srv', srv); localStorage.setItem('sfpp_user', user); localStorage.setItem('sfpp_pass', pass);
                document.getElementById('login-screen').style.display='none';
                document.getElementById('header').style.display='flex';
                document.getElementById('sidebar').style.display='block';
                switchTab('get_live_categories', 'get_live_streams', document.getElementById('btn-live'));
            }
        } catch(e) { alert("Erreur connexion"); }
    }

    async function switchTab(catA, streamA, btn) {
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active'); currentMode = streamA;
        try {
            const r = await fetch(`${srv}/player_api.php?username=${user}&password=${pass}&action=${catA}`);
            const cats = await r.json();
            const side = document.getElementById('sidebar');
            side.innerHTML = `<div class="cat-item active" onclick="loadData('0', this)">TOUT VOIR</div>`;
            cats.forEach(c => {
                const d = document.createElement('div'); d.className='cat-item'; d.innerText=fixText(c.category_name);
                d.onclick=()=>loadData(c.category_id, d); side.appendChild(d);
            });
            loadData('0', side.firstChild);
        } catch(e) {}
    }

    async function loadData(id, btn) {
        document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const grid = document.getElementById('grid'); grid.innerHTML = "Chargement...";
        let url = `${srv}/player_api.php?username=${user}&password=${pass}&action=${currentMode}`;
        if(id !== '0') url += `&category_id=${id}`;
        try {
            const r = await fetch(url);
            currentList = await r.json();
            renderGrid(currentList);
        } catch(e) { grid.innerHTML = "Erreur."; }
    }

    function renderGrid(data) {
        const grid = document.getElementById('grid'); grid.innerHTML = "";
        data.forEach(item => {
            const d = document.createElement('div'); d.className='card';
            d.innerHTML = `<img src="${item.stream_icon || item.cover || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x85/000/fff?text=IMAGE'"><p>${fixText(item.name)}</p>`;
            d.onclick = () => openModal(item);
            grid.appendChild(d);
        });
    }

    async function openModal(item) {
        document.getElementById('modal').style.display='flex';
        document.getElementById('m-title').innerText=fixText(item.name);
        
        const isLive = currentMode === 'get_live_streams';
        document.getElementById('epg-container').style.display = isLive ? 'block' : 'none';
        document.getElementById('plot-container').style.display = isLive ? 'none' : 'block';
        document.getElementById('m-plot').innerText = "Recherche des informations...";
        document.getElementById('m-epg-title').innerText = "Recherche...";
        document.getElementById('series-ui').style.display='none';

        if(isLive) {
            try {
                const r = await fetch(`${srv}/player_api.php?username=${user}&password=${pass}&action=get_short_epg&stream_id=${item.stream_id}`);
                const d = await r.json();
                if(d.epg_listings && d.epg_listings.length > 0) {
                    document.getElementById('m-epg-title').innerText = fixText(d.epg_listings[0].title);
                } else { document.getElementById('m-epg-title').innerText = "Aucun programme (EPG vide)"; }
            } catch(e) {}
        } else {
            const action = (currentMode === 'get_series') ? 'get_series_info&series_id=' : 'get_vod_info&stream_id=';
            try {
                const r = await fetch(`${srv}/player_api.php?username=${user}&password=${pass}&action=${action}${item.series_id || item.stream_id}`);
                const d = await r.json();
                
                // --- RECHERCHE PROFONDE DU RÉSUMÉ ---
                let p = "";
                // On cherche dans tous les endroits possibles de la réponse API
                if (d.info) {
                    p = d.info.plot || d.info.description || d.info.notes || d.info.biography || d.info.text || "";
                }
                if (!p && d.movie_data && d.movie_data.info) {
                    p = d.movie_data.info.plot || d.movie_data.info.description || "";
                }
                
                document.getElementById('m-plot').innerText = fixText(p) || "Désolé, aucun résumé n'est fourni par le serveur pour ce film.";

                if(currentMode === 'get_series' && d.episodes) {
                    document.getElementById('series-ui').style.display='block';
                    document.getElementById('vlc-start').style.display='none';
                    const list = document.getElementById('ep-list'); list.innerHTML = "";
                    Object.keys(d.episodes).forEach(s => {
                        d.episodes[s].forEach(e => {
                            const div = document.createElement('div');
                            div.style = "padding:10px; background:#222; margin-bottom:5px; cursor:pointer; font-size:12px; border-radius:4px; border-left:2px solid var(--accent);";
                            div.innerText = `S${s}E${e.episode_num} - ${fixText(e.title)}`;
                            div.onclick = () => playVLC(`${srv}/series/${user}/${pass}/${e.id}.${e.container_extension}`);
                            list.appendChild(div);
                        });
                    });
                }
            } catch(e) { document.getElementById('m-plot').innerText = "Erreur de chargement."; }
        }

        document.getElementById('vlc-start').onclick = () => {
            const url = isLive ? `${srv}/live/${user}/${pass}/${item.stream_id}.ts` : `${srv}/movie/${user}/${pass}/${item.stream_id}.${item.container_extension}`;
            playVLC(url);
        };
    }

    function playVLC(url) { 
        window.location.href = `vlc://${url}`; 
        setTimeout(() => { window.location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=http;package=org.videolan.vlc;end`; }, 500);
    }

    function doSearch() {
        const q = document.getElementById('search-bar').value.toLowerCase();
        renderGrid(currentList.filter(i => fixText(i.name).toLowerCase().includes(q)));
    }
    function closeModal() { document.getElementById('modal').style.display='none'; }
</script>
</body>
</html>
